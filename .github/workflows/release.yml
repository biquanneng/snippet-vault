name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/extension

jobs:
  release:
    name: Package and draft GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/extension/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # The store rejects re-uploads of an existing version, so the tag and
      # manifest version must agree before anything is packaged.
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Compile TypeScript
        run: pnpm compile

      - name: Build and zip Chrome extension
        run: pnpm zip

      - name: Generate checksums
        working-directory: apps/extension/.output
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snippet-vault-${{ github.ref_name }}
          path: |
            apps/extension/.output/*.zip
            apps/extension/.output/SHA256SUMS.txt
          # `.output` is a dot-directory; upload-artifact skips hidden paths
          # by default, even when the glob names them explicitly.
          include-hidden-files: true
          if-no-files-found: error

      # Drafts stay private until a maintainer reviews and publishes them.
      - name: Create draft GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "${notes}" ]; then
            notes_args=(--notes-file "${notes}")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "SnippetVault ${TAG}" \
            "${notes_args[@]}" \
            apps/extension/.output/*.zip \
            apps/extension/.output/SHA256SUMS.txt
